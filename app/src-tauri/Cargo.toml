[package]
name = "focustimer"
version = "0.1.0"
description = "A Pomodoro focus timer for Windows"
authors = ["omars"]
edition = "2021"

[lib]
name = "focustimer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_StationsAndDesktops", "Win32_Foundation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rodio = { version = "0.19", default-features = false, features = ["symphonia-vorbis", "symphonia-mp3"] }
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"

