<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusTimer</title>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body data-phase="stopped">
    <div class="grain" aria-hidden="true"></div>

    <header class="app-header">
      <div class="phase-pill" id="phase-pill">
        <span class="phase-dot" aria-hidden="true"></span>
        <span id="phase-label">Ready</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btn-stats" title="Stats" aria-label="Stats">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14v4"/><path d="M12 10v8"/><path d="M17 6v12"/></svg>
        </button>
        <button class="icon-btn" id="btn-settings" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
        </button>
      </div>
    </header>

    <main class="timer-screen">
      <div class="current-task-headline" id="current-task">
        <span class="label">Now focusing on</span>
        <span class="current-task-title" id="current-task-title">— no task —</span>
      </div>

      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="ring-track" cx="50" cy="50" r="46" />
          <circle class="ring-progress" id="ring-progress" cx="50" cy="50" r="46" transform="rotate(-90 50 50)" />
        </svg>
        <div class="ring-center">
          <div class="timer-display" id="timer-display" aria-live="polite">25:00</div>
          <div class="cycle-bar" id="cycle-bar" aria-label="Cycle progress"></div>
        </div>
      </div>

      <div class="controls">
        <button class="btn-primary" id="btn-primary">Start</button>
        <button class="btn-ghost" id="btn-skip" title="Skip phase" aria-label="Skip phase">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
          <span>Skip</span>
        </button>
      </div>
    </main>

    <section class="task-panel" id="task-panel">
      <header class="task-panel-header">
        <span class="label">Tasks</span>
        <span class="task-panel-count" id="task-count"></span>
      </header>
      <form class="add-task" id="add-task-form">
        <input
          type="text"
          id="add-task-input"
          placeholder="What are you working on?"
          autocomplete="off"
        />
      </form>
      <ul class="task-list" id="task-list"></ul>
    </section>
  </body>
</html>
